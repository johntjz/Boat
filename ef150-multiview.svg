<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <pattern id="cadGridCom" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.12"/>
      <path d="M 200 0 L 0 0 0 200" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.25"/>
    </pattern>
    <radialGradient id="comBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a201c"/>
      <stop offset="100%" stop-color="#020d0b"/>
    </radialGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#comBg)"/>
  <rect width="1600" height="900" fill="url(#cadGridCom)"/>
  <rect x="20" y="20" width="1560" height="860" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>
  <rect x="25" y="25" width="1550" height="850" fill="none" stroke="#10b981" stroke-width="0.5" stroke-opacity="0.2"/>

  <g fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" fill-opacity="0.6">
    <text x="35" y="40">01</text><text x="400" y="40">02</text><text x="800" y="40">03</text><text x="1200" y="40">04</text><text x="1560" y="40">05</text>
    <text x="30" y="225">A</text><text x="30" y="450">B</text><text x="30" y="675">C</text><text x="30" y="865">D</text>
  </g>

  <line x1="800" y1="25" x2="800" y2="875" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8,4"/>
  <line x1="25" y1="450" x2="1575" y2="450" stroke="#10b981" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="8,4"/>

  <g id="ef150-plan">
    <text x="60" y="65" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" letter-spacing="1.5">TOP-DOWN PLAN: 150-PASSENGER CABIN</text>
    <text x="60" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">LOA 28.50m (93.5 FT) | FOIL SPAN 9.80m</text>

    <path d="M 720 225 C 640 160, 480 130, 240 130 C 140 130, 90 150, 60 170 L 60 280 C 90 300, 140 320, 240 320 C 480 320, 640 290, 720 225 Z" fill="#082b24" fill-opacity="0.7" stroke="#10b981" stroke-width="2" filter="url(#emeraldGlow)"/>

    <rect x="200" y="160" width="380" height="130" rx="8" fill="#051a16" stroke="#10b981" stroke-width="1.2"/>
    <line x1="200" y1="225" x2="580" y2="225" stroke="#10b981" stroke-width="0.75" stroke-dasharray="6,3"/>
    
    <g fill="#10b981" fill-opacity="0.3" stroke="#10b981" stroke-width="0.5">
      <rect x="220" y="170" width="160" height="20" rx="2"/><rect x="220" y="195" width="160" height="20" rx="2"/>
      <rect x="220" y="235" width="160" height="20" rx="2"/><rect x="220" y="260" width="160" height="20" rx="2"/>
      <rect x="400" y="170" width="150" height="20" rx="2"/><rect x="400" y="195" width="150" height="20" rx="2"/>
      <rect x="400" y="235" width="150" height="20" rx="2"/><rect x="400" y="260" width="150" height="20" rx="2"/>
    </g>
    <text x="390" y="222" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="1">150 PASSENGERS + 4 CREW</text>

    <path d="M 580 190 Q 640 225 580 260 Z" fill="#0a3a30" stroke="#00f2ff" stroke-width="1.2"/>
    <text x="600" y="228" fill="#00f2ff" font-family="'JetBrains Mono', monospace" font-size="8">FCS</text>

    <line x1="60" y1="365" x2="720" y2="365" stroke="#94a3b8" stroke-width="1"/>
    <line x1="60" y1="358" x2="60" y2="372" stroke="#94a3b8" stroke-width="1"/>
    <line x1="720" y1="358" x2="720" y2="372" stroke="#94a3b8" stroke-width="1"/>
    <text x="390" y="385" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">LOA: 28.50 METERS (93.5 FT)</text>
  </g>

  <g id="ef150-elevation" transform="translate(850, 0)">
    <text x="60" y="65" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" letter-spacing="1.5">PORT SIDE PROFILE (FOIL-BORNE)</text>
    <text x="60" y="82" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">80% HYDRODYNAMIC DRAG DECOUPLING</text>

    <g transform="translate(0, 30)">
      <path d="M 40 145 C 160 85, 480 85, 620 135 C 580 170, 180 175, 40 145 Z" fill="#082b24" fill-opacity="0.8" stroke="#10b981" stroke-width="2" filter="url(#emeraldGlow)"/>

      <path d="M 160 115 C 280 100, 440 100, 540 125 L 530 135 C 440 115, 280 115, 160 128 Z" fill="#00f2ff" fill-opacity="0.4" stroke="#00f2ff" stroke-width="0.8"/>

      <line x1="500" y1="145" x2="500" y2="265" stroke="#10b981" stroke-width="5"/>
      <path d="M 450 265 C 490 260, 540 260, 560 268 C 530 274, 480 274, 450 265 Z" fill="#10b981" stroke="#10b981" stroke-width="2"/>

      <line x1="130" y1="155" x2="130" y2="260" stroke="#10b981" stroke-width="5"/>
      <rect x="100" y="252" width="65" height="18" rx="4" fill="#051a16" stroke="#00f2ff" stroke-width="2"/>
      <line x1="97" y1="247" x2="97" y2="275" stroke="#00f2ff" stroke-width="3"/>
      <text x="175" y="265" fill="#00f2ff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">2x 650 kW PODS</text>

      <line x1="10" y1="220" x2="650" y2="220" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6,4"/>
      <text x="640" y="212" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="end">CRUISE WATERLINE (38 KNOTS)</text>

      <line x1="515" y1="145" x2="515" y2="265" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2"/>
      <text x="525" y="210" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9">RIDE CLEARANCE: 1.8m</text>
    </g>
  </g>

  <g id="ef150-transom" transform="translate(0, 470)">
    <text x="60" y="45" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" letter-spacing="1.5">REAR TRANSOM & HYDROFOIL ARRANGEMENT</text>
    <text x="60" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">INVERTED-V FOIL AFT ARCHITECTURE</text>

    <path d="M 220 90 Q 390 70 560 90 L 520 200 Q 390 220 260 200 Z" fill="#082b24" stroke="#10b981" stroke-width="2"/>
    <rect x="270" y="105" width="240" height="60" rx="4" fill="#051a16" stroke="#10b981" stroke-width="1"/>
    <text x="390" y="140" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">BOARDING ACCESS & GATES</text>

    <circle cx="320" cy="245" r="18" fill="#051a16" stroke="#00f2ff" stroke-width="3"/>
    <circle cx="320" cy="245" r="5" fill="#00f2ff"/>
    <circle cx="460" cy="245" r="18" fill="#051a16" stroke="#00f2ff" stroke-width="3"/>
    <circle cx="460" cy="245" r="5" fill="#00f2ff"/>
    
    <path d="M 260 200 L 320 280 L 390 230 L 460 280 L 520 200" fill="none" stroke="#10b981" stroke-width="3.5"/>
    <text x="390" y="275" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">INVERTED V-FOIL (AFT)</text>
  </g>

  <g id="ef150-charging" transform="translate(850, 470)">
    <text x="60" y="45" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" letter-spacing="1.5">3.5 MW MCS CHARGING ARM DOCK INTERACTION</text>
    <text x="60" y="62" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">20-MINUTE ULTRA-FAST TURNAROUND SYSTEM</text>

    <rect x="40" y="90" width="140" height="230" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="110" y="120" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">FERRY PIER</text>
    
    <rect x="55" y="140" width="110" height="70" rx="3" fill="#051a16" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="110" y="170" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold" text-anchor="middle">4.0 MWh BESS</text>
    <text x="110" y="185" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">GRID BUFFER</text>

    <path d="M 165 175 L 230 140 L 290 160" fill="none" stroke="#00f2ff" stroke-width="4"/>
    <circle cx="230" cy="140" r="5" fill="#00f2ff"/>
    <rect x="285" y="152" width="22" height="16" rx="2" fill="#00f2ff"/>
    <text x="240" y="130" fill="#00f2ff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="bold">3.5 MW MCS ARM</text>

    <path d="M 290 160 C 340 150, 480 150, 620 180 L 600 240 C 450 220, 320 220, 270 200 Z" fill="#082b24" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="295" cy="160" r="6" fill="#f59e0b"/>
    <text x="315" y="180" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="8">RECEPTACLE</text>

    <rect x="360" y="250" width="260" height="50" rx="4" fill="#051a16" stroke="#10b981" stroke-width="1"/>
    <text x="375" y="270" fill="#fff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">CHARGING CYCLE: 11 MINS</text>
    <text x="375" y="287" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="9">FULL TURNAROUND TARGET: &lt; 20 MINS</text>
  </g>

  <g transform="translate(1050, 770)">
    <rect x="0" y="0" width="510" height="95" fill="#041a15" stroke="#10b981" stroke-width="1.5"/>
    <line x1="0" y1="32" x2="510" y2="32" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.4"/>
    <line x1="280" y1="32" x2="280" y2="95" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.4"/>
    
    <text x="15" y="22" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" letter-spacing="2">AERO-MARINE SYSTEMS // GREATER BAY AREA</text>
    <text x="15" y="50" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">VESSEL: <tspan fill="#fff" font-weight="bold">BAYWING EF-150 EXPRESS</tspan></text>
    <text x="15" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">CAPACITY: 150 PASSENGERS + 4 CREW</text>
    <text x="15" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">BATTERY: <tspan fill="#00f2ff">1.2 MWh 800V DC (LFP)</tspan></text>
    
    <text x="295" y="50" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">ALL-UP DISP: <tspan fill="#fff">56 TONNES</tspan></text>
    <text x="295" y="68" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">CRUISE SPEED: <tspan fill="#10b981">38.0 KNOTS</tspan></text>
    <text x="295" y="84" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">CLASSIFICATION: <tspan fill="#10b981">DNV HSLC COMPLIANT</tspan></text>
  </g>
</svg>
