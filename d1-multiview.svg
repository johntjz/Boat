<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#0f2027"/><stop offset="100%" stop-color="#040914"/></radialGradient>
    <linearGradient id="hullGrad" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e293b"/><stop offset="50%“ stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#00f2ff"/><stop offset="100%" stop-color="#0066ff"/></linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="1600" height="1200" fill="url(#bgGlow)"/>
  <path d="M 0 0 H 1600 V 1200 H 0 Z" fill="none" stroke="#00f2ff" stroke-width="1" stroke-opacity="0.1"/>

  <!-- TITLE BLOCK -->
  <text x="50" y="50" fill="#00f2ff" font-family="monospace" font-size="20" font-weight="bold" letter-spacing="3">BAYWING-D1 // 1:8 ALIEN-CLASS HULL ARCHITECTURE</text>
  <text x="50" y="75" fill="#94a3b8" font-family="monospace" font-size="12">MULTI-VIEW ORTHOGRAPHIC PROJECTION & CFD DYNAMICS</text>

  <!-- 1. TOP-DOWN VIEW -->
  <g transform="translate(100, 120)">
    <text x="0" y="20" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">01. TOP-DOWN PLAN</text>
    <!-- Sleek Arrowhead Alien Hull -->
    <path d="M 50 120 Q 150 70 300 70 Q 400 70 450 120 Q 400 170 300 170 Q 150 170 50 120 Z" fill="url(#hullGrad)" stroke="#00f2ff" stroke-width="2" filter="url(#neon)"/>
    <!-- Canards / Forward Foils -->
    <path d="M 320 60 L 370 120 L 320 180" fill="none" stroke="#10b981" stroke-width="2"/>
    <!-- Cockpit / Avionics Dome -->
    <ellipse cx="220" cy="120" rx="60" ry="25" fill="#00f2ff" fill-opacity="0.2" stroke="#00f2ff" stroke-width="1"/>
  </g>

  <!-- 2. PORT (LEFT) SIDE VIEW -->
  <g transform="translate(600, 120)">
    <text x="0" y="20" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">02. PORT SIDE ELEVATION</text>
    <path d="M 20 120 C 100 90 350 90 430 130 C 400 150 100 160 20 120 Z" fill="url(#hullGrad)" stroke="#00f2ff" stroke-width="2" filter="url(#neon)"/>
    <!-- Strut & T-Foil -->
    <line x1="350" y1="130" x2="350" y2="210" stroke="#00f2ff" stroke-width="4"/>
    <path d="M 320 210 L 380 210" stroke="#00f2ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="140" x2="120" y2="220" stroke="#00f2ff" stroke-width="4"/>
    <path d="M 90 220 L 150 220" stroke="#00f2ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="0" y1="170" x2="480" y2="170" stroke="#fff" stroke-opacity="0.3" stroke-dasharray="5,5"/>
  </g>

  <!-- 3. STARBOARD (RIGHT) SIDE VIEW -->
  <g transform="translate(1100, 120)">
    <text x="0" y="20" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">03. STARBOARD SIDE ELEVATION</text>
    <path d="M 20 120 C 100 90 350 90 430 130 C 400 150 100 160 20 120 Z" fill="url(#hullGrad)" stroke="#00f2ff" stroke-width="2" filter="url(#neon)"/>
    <line x1="350" y1="130" x2="350" y2="210" stroke="#00f2ff" stroke-width="4"/>
    <path d="M 320 210 L 380 210" stroke="#00f2ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="120" y1="140" x2="120" y2="220" stroke="#00f2ff" stroke-width="4"/>
    <path d="M 90 220 L 150 220" stroke="#00f2ff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- 4. BOTTOM-UP VIEW -->
  <g transform="translate(100, 420)">
    <text x="0" y="20" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">04. BOTTOM-UP UNDERCARRIAGE</text>
    <path d="M 50 120 Q 150 70 300 70 Q 400 70 450 120 Q 400 170 300 170 Q 150 170 50 120 Z" fill="none" stroke="#00f2ff" stroke-width="2"/>
    <rect x="80" y="105" width="40" height="30" rx="5" fill="#10b981" fill-opacity="0.4" stroke="#10b981"/>
  </g>

  <!-- 5. REAR (TRANSOM) VIEW -->
  <g transform="translate(600, 420)">
    <text x="0" y="20" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">05. REAR TRANSOM VIEW</text>
    <path d="M 120 80 Q 220 70 320 80 L 300 160 Q 220 180 140 160 Z" fill="url(#hullGrad)" stroke="#00f2ff" stroke-width="2"/>
    <circle cx="180" cy="120" r="15" fill="none" stroke="#00f2ff" stroke-width="3"/>
    <circle cx="260" cy="120" r="15" fill="none" stroke="#00f2ff" stroke-width="3"/>
  </g>

  <!-- 6. FRONT (BOW) VIEW -->
  <g transform="translate(1100, 420)">
    <text x="0" y="20" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">06. FRONT BOW PROFILE</text>
    <path d="M 220 70 Q 220 120 220 170 Q 280 140 320 110 Q 280 80 220 70 Z" fill="url(#hullGrad)" stroke="#00f2ff" stroke-width="2"/>
    <path d="M 120 110 Q 160 80 220 70 Q 220 120 220 170 Q 160 140 120 110 Z" fill="url(#hullGrad)" stroke="#00f2ff" stroke-width="2"/>
  </g>

  <!-- 7. CFD HYDRODYNAMIC TESTING VIEW -->
  <g transform="translate(350, 720)">
    <text x="0" y="20" fill="#fff" font-family="monospace" font-size="12" font-weight="bold">07. CFD HYDRODYNAMIC FLUID & STREAMLINE ANALYSIS</text>
    <path d="M 100 100 C 200 60 600 60 700 100 C 650 120 200 130 100 100 Z" fill="url(#hullGrad)" stroke="#00f2ff" stroke-width="2"/>
    <line x1="550" y1="100" x2="550" y2="180" stroke="#00f2ff" stroke-width="4"/>
    <path d="M 500 180 L 600 180" stroke="#00f2ff" stroke-width="6" stroke-linecap="round"/>
    <!-- Streamlines -->
    <path d="M 0 60 Q 350 20 900 60" fill="none" stroke="#10b981" stroke-width="2" filter="url(#neon)"/>
    <path d="M 0 80 Q 350 40 900 80" fill="none" stroke="#00f2ff" stroke-width="2"/>
    <path d="M 0 140 Q 350 180 900 140" fill="none" stroke="#f59e0b" stroke-width="2"/>
  </g>
</svg>
